server {
    listen 5173;
    root /usr/share/nginx/html;

    # Client-side routes (/roofs/..., /contracts/..., /demo) all load the single page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
