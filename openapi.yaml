components:
  securitySchemes:
    OperatorApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Operator key required when configured; mandatory outside local mode.
    EventApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Separate key used only by the oracle event relay.
  parameters:
    RoofId:
      name: roof_id
      in: path
      required: true
      schema:
        $ref: "schema/verification.json#/properties/roof_id"
      example: ATH-0142

  responses:
    NotFound:
      description: Kayıt bulunamadı
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: not_found
            message: "ATH-9999 için kayıt bulunamadı."
    ValidationError:
      description: İstek gövdesi şema ile uyuşmuyor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: validation_error
            message: "readings dizisi boş olamaz."
    MeasurementConflict:
      description: >-
        İstek, çatının mevcut ölçüm durumuyla çelişiyor. code alanı iki durumu ayırır.
        missing_measurement: karşılaştırma için gereken ölçüm yok (ör. before ölçümü
        olmadan after gönderildi, ya da doğrulama için before/after ölçümü eksik).
        mixed_data_source: measured ve simulated değerler karşılaştırılmaya çalışıldı
        (ör. measured bir after ölçümü, simulated bir before ölçümüyle). Böyle bir fark
        anlamsızdır ve simüle değerlerin gerçekmiş gibi geçmesine izin verirdi, bu yüzden
        reddedilir.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missing_measurement:
              summary: Gereken ölçüm yok
              value:
                code: missing_measurement
                message: "ATH-1002 has no 'before' measurement yet."
            mixed_data_source:
              summary: measured ve simulated karıştırıldı
              value:
                code: mixed_data_source
                message: "Cannot compare a measured measurement with the simulated before measurement 3fa85f64-5717-4562-b3fc-2c963f66afa6."
    StaleRound:
      description: >-
        Event, backend'in yansıttığı demo turundan başka bir tura ait. Listener'ın açılıştaki
        geçmiş taramasında beklenir; oracle bunları atlandı olarak kaydeder.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: stale_round
            message: Event is from demo round 1; the backend mirrors round 3.
    WeatherUnavailable:
      description: Hava verisi ne veritabanında ne Open-Meteo'da bulunabildi.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: weather_unavailable
            message: "Open-Meteo request failed."
    NotGenerated:
      description: İstenen rapor henüz scripts/ tarafından üretilmedi.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: not_generated
            message: "metrics.json has not been generated; run scripts/metrics.py."

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            Makine tarafından okunur hata kodu, ör. not_found, validation_error,
            missing_measurement, mixed_data_source, weather_unavailable, not_generated.
        message: { type: string }

    DataSource:
      $ref: "schema/verification.json#/$defs/data_source"

    RoofSummary:
      allOf:
        - $ref: "#/components/schemas/RoofFields"
      unevaluatedProperties: false

    RoofFields:
      description: >-
        RoofSummary ve RoofDetail'in ortak alanları. Açık bırakılmıştır; kapatma
        (unevaluatedProperties) onu kullanan şemalarda yapılır, aksi halde allOf ile
        genişletilen RoofDetail measurement_history alanını reddederdi.
      type: object
      required:
        - roof_id
        - city
        - roof_class
        - lat
        - lon
        - area_m2
        - albedo
        - surface_temp_c
        - priority_score
        - estimated_cost_eur
        - status
        - data_source
        - geometry
      properties:
        roof_id:
          $ref: "schema/verification.json#/properties/roof_id"
        city:
          type: string
          description: Çatının bulunduğu şehir; /roofs?city= filtresi bu alanla büyük/küçük harf duyarsız eşleşir.
          example: Athens
        roof_class:
          $ref: "#/components/schemas/RoofClass"
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
        area_m2:
          type: number
          minimum: 0
          description: Çatı yüzey alanı (m²).
        albedo:
          type: number
          minimum: 0
          maximum: 1
          description: Mevcut yüzeyin güneş yansıtma katsayısı.
        surface_temp_c:
          type: number
          description: En güncel ölçülen çatı yüzey sıcaklığı (°C).
        priority_score:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            Çatının seçim önceliğini belirleyen bileşik puan, 0-1 aralığında (yüksek = daha
            öncelikli). Yüzde değildir.
        estimated_cost_eur:
          type: number
          minimum: 0
          description: >-
            Tahmini kaplama maliyeti (EUR), area_m2 x COST_PER_M2_EUR. Birim fiyat backend
            .env'inden okunur, varsayılan 12 EUR/m². Bütçe seçimi bu alanı kullanır.
          example: 7686.0
        status:
          type: string
          description: >-
            Çatının proje yaşam döngüsündeki durumu (doğrulama kararından bağımsız).
          example: candidate
        data_source:
          allOf:
            - $ref: "#/components/schemas/DataSource"
          description: >-
            albedo ve surface_temp_c değerlerinin kaynağı: uydudan ölçülmüş çatılar
            measured, demo seed çatıları simulated.
        geometry:
          oneOf:
            - $ref: "#/components/schemas/GeoJsonPolygon"
            - type: "null"
          description: >-
            Çatı ayak izi (PostGIS geom, ST_AsGeoJSON). /roofs listesinde sadece
            include_geometry=true ile dolar, yoksa null; /roofs/{roof_id} her zaman döner.

    RoofDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/RoofFields"
        - type: object
          required: [measurement_history, geometry]
          properties:
            geometry:
              $ref: "#/components/schemas/GeoJsonPolygon"
            measurement_history:
              type: array
              items:
                $ref: "#/components/schemas/MeasurementHistoryEntry"

    GeoJsonPolygon:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      description: >-
        RFC 7946 Polygon. Her konum [lon, lat] sırasındadır (enlem-boylam değil), 7 ondalık
        basamak (~1 cm). İlk halka dış sınırdır ve kapalıdır (ilk nokta = son nokta).
      properties:
        type:
          const: Polygon
        coordinates:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 4
            items:
              type: array
              minItems: 2
              maxItems: 2
              items: { type: number }

    MeasurementHistoryEntry:
      type: object
      additionalProperties: false
      required: [measurement_id, phase, measured_at, anomaly_flags, data_source]
      properties:
        measurement_id: { type: string, format: uuid }
        phase:
          $ref: "#/components/schemas/MeasurementPhase"
        measured_at: { type: string, format: date-time }
        normalized_delta_c:
          oneOf:
            - $ref: "schema/verification.json#/properties/normalized_delta_c"
            - type: "null"
          description: "before fazında henüz hesaplanmaz, null olur."
        anomaly_flags:
          $ref: "schema/verification.json#/properties/anomaly_flags"
        data_source:
          $ref: "#/components/schemas/DataSource"

    MeasurementPhase:
      type: string
      enum: [before, after, durability]
      description: >-
        before: kaplama öncesi referans ölçüm. after: kaplama sonrası ölçüm.
        durability: thresholds.json'daki durability_check_days sonrası kalıcılık kontrolü.

    Reading:
      type: object
      additionalProperties: false
      required: [timestamp, surface_temp_c]
      properties:
        timestamp: { type: string, format: date-time }
        surface_temp_c: { type: number }

    MeasurementCreateRequest:
      type: object
      additionalProperties: false
      required: [roof_id, phase, readings, device_id]
      properties:
        roof_id:
          $ref: "schema/verification.json#/properties/roof_id"
        phase:
          $ref: "#/components/schemas/MeasurementPhase"
        readings:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Reading"
        device_id:
          type: string
          description: Ölçümü üreten cihazın kimliği.
        data_source:
          type: string
          enum: [measured, simulated]
          default: simulated
          description: >-
            Okumaların kaynağı. Bu projede fiziksel deney yapılmadığından varsayılan
            simulated; gerçek bir saha cihazı measured gönderir. third_party kabul edilmez.

    MeasurementCreateResponse:
      type: object
      additionalProperties: false
      required: [measurement_id, normalized_delta_c, anomaly_flags, data_source]
      properties:
        measurement_id: { type: string, format: uuid }
        normalized_delta_c:
          $ref: "schema/verification.json#/properties/normalized_delta_c"
        anomaly_flags:
          $ref: "schema/verification.json#/properties/anomaly_flags"
        data_source:
          $ref: "#/components/schemas/DataSource"

    PhotoUploadResponse:
      type: object
      additionalProperties: false
      required: [coverage_pct, mask_preview_url]
      properties:
        coverage_pct:
          $ref: "schema/verification.json#/properties/coverage_pct"
        mask_preview_url:
          type: string
          format: uri
          description: Tespit edilen kaplama maskesinin görsel önizlemesi.

    WeatherPoint:
      type: object
      additionalProperties: false
      required:
        [timestamp, ambient_c, radiation_wm2, wind_ms, max_gust_ms, precipitation_mm, data_source]
      properties:
        timestamp: { type: string, format: date-time }
        ambient_c:
          $ref: "schema/verification.json#/properties/weather/properties/ambient_c"
        radiation_wm2:
          $ref: "schema/verification.json#/properties/weather/properties/radiation_wm2"
        wind_ms:
          $ref: "schema/verification.json#/properties/weather/properties/wind_ms"
        max_gust_ms:
          $ref: "schema/verification.json#/properties/weather/properties/max_gust_ms"
        precipitation_mm:
          type: number
          minimum: 0
          description: >-
            Saatlik yağış (mm). thresholds.json'daki force_majeure_precip_mm ile karşılaştırılır.
        data_source:
          allOf:
            - $ref: "#/components/schemas/DataSource"
          enum: [third_party, simulated]
          description: >-
            Open-Meteo kayıtları third_party, demo seed'in ürettiği kayıtlar simulated.
            Seed kayıtlarını third_party olarak etiketlemek simüle veriyi gerçek dış kaynak
            verisi gibi gösterirdi. measured hiçbir zaman dönmez.

    TrancheStatus:
      type: string
      enum: [pending, released, held]

    TrancheName:
      type: string
      enum: [QUALITY, DURABILITY, FORCE_MAJEURE_RESERVE]
      description: >-
        CoolRoofEscrow.sol Tranche enum'u. QUALITY %60 (after doğrulaması), DURABILITY %30
        (180 gün sonraki kontrol), FORCE_MAJEURE_RESERVE %10 (mücbir sebepte yükleniciye
        ödenen rezerv).

    Wei:
      type: string
      pattern: "^[0-9]+$"
      description: uint256 wei miktarı. JSON sayısı 2^53'ü aştığı için ondalık rakam dizisi olarak taşınır.
      example: "600000000000000000"

    EthAddress:
      type: string
      pattern: "^0x[a-fA-F0-9]{40}$"

    Tranche:
      type: object
      additionalProperties: false
      required: [name, pct, amount_wei, status, tx_hash, released_at]
      properties:
        name:
          $ref: "#/components/schemas/TrancheName"
        pct:
          type: number
          minimum: 0
          maximum: 100
          description: Toplam sponsor fonunun bu dilime ayrılan yüzdesi.
        amount_wei:
          oneOf:
            - $ref: "#/components/schemas/Wei"
            - type: "null"
          description: >-
            total_amount_wei'den kontratla aynı bölüşümle hesaplanır (yuvarlama artığı
            rezerve gider, toplam her zaman depozitoya eşittir). Proje yoksa null.
        status:
          $ref: "#/components/schemas/TrancheStatus"
        tx_hash:
          oneOf:
            - $ref: "schema/verification.json#/properties/evidence_hash"
            - type: "null"
          description: Serbest bırakma işleminin zincir üzerindeki hash'i, henüz serbest bırakılmadıysa null.
        released_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"

    ContractThresholds:
      type: object
      additionalProperties: false
      description: Çatının şehri için schema/thresholds.json'dan seçilen eşikler (varsayılanlar + şehir değerleri).
      required:
        - min_normalized_delta_c
        - min_coverage_pct
        - force_majeure_gust_ms
        - force_majeure_precip_mm
        - durability_check_days
        - winter_penalty_check
        - rationale
      properties:
        min_normalized_delta_c: { type: number }
        min_coverage_pct: { type: number }
        force_majeure_gust_ms: { type: number }
        force_majeure_precip_mm: { type: number }
        durability_check_days: { type: integer }
        winter_penalty_check: { type: boolean }
        rationale:
          type: [string, "null"]
          description: >-
            Şehrin soğutma eşiğinin neden bu değerde olduğu (schema/thresholds.json by_city;
            türetme scripts/threshold_rationale.py, sonucu data/snapshots/threshold_rationale.json).
            Kendi kaydı olmayan şehirde null. Kaba bir tahmindir, yerel ölçümle kalibre edilmemiştir.

    ContractStatus:
      type: object
      additionalProperties: false
      required:
        - roof_id
        - contract_address
        - sponsor
        - contractor
        - total_amount_wei
        - thresholds
        - tranches
        - events
      description: >-
        contract_address, sponsor, contractor ve total_amount_wei backend .env'indeki
        deployment ayarlarından gelir. Dilimi olmayan çatıda (zincirde projesi yok) ve
        kontrat henüz deploy edilmemişse null döner.
      properties:
        roof_id:
          $ref: "schema/verification.json#/properties/roof_id"
        contract_address:
          oneOf:
            - $ref: "#/components/schemas/EthAddress"
            - type: "null"
        sponsor:
          oneOf:
            - $ref: "#/components/schemas/EthAddress"
            - type: "null"
        contractor:
          oneOf:
            - $ref: "#/components/schemas/EthAddress"
            - type: "null"
        total_amount_wei:
          oneOf:
            - $ref: "#/components/schemas/Wei"
            - type: "null"
        thresholds:
          $ref: "#/components/schemas/ContractThresholds"
        tranches:
          type: array
          items:
            $ref: "#/components/schemas/Tranche"
        events:
          type: array
          description: Oracle'ın kaydettiği zincir eventleri, occurred_at sırasıyla.
          items:
            $ref: "#/components/schemas/ContractEventRecord"

    ContractEventName:
      type: string
      enum: [TrancheReleased, PaymentHeld, ForceMajeureApplied, UnreleasedReclaimed]

    ContractEventFields:
      description: >-
        ContractEventCreate ve ContractEventRecord'un ortak alanları. TrancheReleased ve
        PaymentHeld bir dilimin durumunu değiştirdiği için tranche zorunludur.
        TrancheReleased ve UnreleasedReclaimed para hareket ettirdiği için amount_wei ister;
        UnreleasedReclaimed'de amount_wei sponsora dönen toplam tutardır, tranche null'dır.
      type: object
      properties:
        event_name:
          $ref: "#/components/schemas/ContractEventName"
        tranche:
          oneOf:
            - $ref: "#/components/schemas/TrancheName"
            - type: "null"
        amount_wei:
          oneOf:
            - $ref: "#/components/schemas/Wei"
            - type: "null"
        tx_hash:
          $ref: "schema/verification.json#/properties/evidence_hash"
        block_number:
          type: integer
          minimum: 0
        reason:
          type: [string, "null"]
          description: >-
            PaymentHeld eventinin gerekçesi (ör. "Measurement thresholds not met").
            ForceMajeureApplied için oracle zincirdeki fırtına değerlerini yazar
            (ör. "gusts 24.0 m/s, 68.0 mm precipitation"); backend bunları başka yerde tutmaz.
        occurred_at:
          type: string
          format: date-time
        round:
          type: integer
          minimum: 0
          default: 0
          description: >-
            Eventi yayan zincir projesinin demo turu ("ATH-0142#3" için 3, eksiz proje için 0).
            Gövdede yoksa 0 sayılır.
      allOf:
        - if:
            properties:
              event_name: { enum: [TrancheReleased, PaymentHeld] }
          then:
            required: [tranche]
            properties:
              tranche: { $ref: "#/components/schemas/TrancheName" }
        - if:
            properties:
              event_name: { enum: [TrancheReleased, UnreleasedReclaimed] }
          then:
            required: [amount_wei]
            properties:
              amount_wei: { $ref: "#/components/schemas/Wei" }

    ContractEventCreate:
      allOf:
        - $ref: "#/components/schemas/ContractEventFields"
      required: [event_name, tx_hash, block_number, occurred_at]
      unevaluatedProperties: false

    ContractEventRecord:
      allOf:
        - $ref: "#/components/schemas/ContractEventFields"
      required:
        - roof_id
        - event_name
        - tranche
        - amount_wei
        - tx_hash
        - block_number
        - reason
        - occurred_at
        - round
      properties:
        roof_id:
          $ref: "schema/verification.json#/properties/roof_id"
      unevaluatedProperties: false

    DemoRoundStatus:
      type: object
      additionalProperties: false
      required: [round]
      properties:
        round: { type: integer, minimum: 0 }

    DemoResetResponse:
      type: object
      additionalProperties: false
      required: [round, roof_ids, deleted, restored]
      properties:
        round:
          type: integer
          minimum: 1
          description: Bu sıfırlamanın açtığı demo turu; zincirde scripts/demo-round.sh fonlar.
        roof_ids:
          type: array
          items:
            $ref: "schema/verification.json#/properties/roof_id"
        deleted:
          type: object
          additionalProperties: false
          required:
            - contract_events
            - contract_states
            - verifications
            - measurements
            - weather_records
            - photo_files
          properties:
            contract_events:
              type: integer
              minimum: 0
              description: Önceki turun zincirden aktarılmış eventleri.
            contract_states:
              type: integer
              minimum: 0
              description: Önceki turun dilim durumları; yeni tur için pending olarak yeniden eklenir.
            verifications: { type: integer, minimum: 0 }
            measurements: { type: integer, minimum: 0 }
            weather_records:
              type: integer
              minimum: 0
              description: Sadece simulated seed hava kayıtları; third_party kayıtlar silinmez.
            photo_files:
              type: integer
              minimum: 0
              description: Silinen ölçümlerin data/photos altındaki yükleme ve maske dosyaları.
        restored:
          type: object
          additionalProperties: false
          required: [roofs, measurements, verifications, weather_records, contract_states]
          properties:
            roofs: { type: integer, minimum: 0 }
            measurements: { type: integer, minimum: 0 }
            verifications: { type: integer, minimum: 0 }
            weather_records: { type: integer, minimum: 0 }
            contract_states:
              type: integer
              minimum: 0
              description: Pending ve tx_hash'siz eklenen dilimler (yeni turda üç çatı için 9).

    RoundWallet:
      type: object
      additionalProperties: false
      required: [address, balance, round_cost, rounds_left]
      properties:
        address:
          $ref: "#/components/schemas/EthAddress"
        balance:
          type: string
          description: Bakiye, POL (ondalık dizgi).
        round_cost:
          type: string
          description: >-
            Bir demo turunun bu cüzdana maliyeti, POL. Sponsor: üç depozito ve üç createProject;
            oracle: kurulumdaki fırtına kalite ödemesi ve çatı başına bir submitVerification.
        rounds_left:
          type: integer
          minimum: 0
          description: Güncel gas fiyatıyla bakiyenin karşıladığı tam tur sayısı.

    OracleHealth:
      type: object
      additionalProperties: false
      required:
        - ok
        - network
        - chain_id
        - contract_address
        - oracle_address
        - balance
        - gas_price_gwei
        - sponsor
        - oracle
      properties:
        ok: { type: boolean, const: true }
        network:
          type: string
          enum: [local, amoy, other]
          description: >-
            Oracle'ın bağlı olduğu zincir: local (31337), amoy (80002) ya da başka bir zincir.
            Arayüz bunu her sayfada rozet olarak gösterir. local dışında işlem göndermek
            ALLOW_MAINNET_SPEND=true ister.
        chain_id: { type: integer, minimum: 1 }
        contract_address:
          $ref: "#/components/schemas/EthAddress"
        oracle_address:
          $ref: "#/components/schemas/EthAddress"
        balance:
          type: string
          description: Oracle cüzdanının bakiyesi, POL (oracle.balance ile aynı).
        gas_price_gwei: { type: string }
        sponsor:
          $ref: "#/components/schemas/RoundWallet"
        oracle:
          $ref: "#/components/schemas/RoundWallet"

    SimulatedReading:
      type: object
      additionalProperties: false
      required: [timestamp, surface_temp_c, data_source]
      properties:
        timestamp: { type: string, format: date-time }
        surface_temp_c: { type: number }
        data_source:
          allOf:
            - $ref: "#/components/schemas/DataSource"
          const: simulated

    SimulatedPhase:
      type: object
      additionalProperties: false
      required: [start, albedo, readings]
      properties:
        start: { type: string, format: date-time }
        albedo:
          type: number
          minimum: 0
          maximum: 1
          description: Simülasyonda kullanılan albedo (önce çatının uydu albedosu, sonra kaplama).
        readings:
          type: array
          description: 15 dakikalık oturum, 30 saniye aralıklı, ±0.3 °C sensör gürültüsüyle.
          items:
            $ref: "#/components/schemas/SimulatedReading"

    SimulatedSeries:
      type: object
      additionalProperties: false
      required: [roof_id, data_source, model, weather_source, before, after]
      properties:
        roof_id:
          $ref: "schema/verification.json#/properties/roof_id"
        data_source:
          allOf:
            - $ref: "#/components/schemas/DataSource"
          const: simulated
        model:
          type: string
          description: Yüzey sıcaklığını üreten fiziksel model.
        weather_source:
          type: string
          description: Modeli süren hava verisinin kaynağı (gerçek, third_party).
        before:
          $ref: "#/components/schemas/SimulatedPhase"
        after:
          $ref: "#/components/schemas/SimulatedPhase"

    AlbedoGroup:
      type: object
      additionalProperties: false
      required: [n, albedo_range, mean_c, median_c, std_c, mean_area_m2, centroid]
      properties:
        n: { type: integer, minimum: 0 }
        albedo_range:
          type: array
          items: { type: number }
          minItems: 2
          maxItems: 2
        mean_c: { type: number }
        median_c: { type: number }
        std_c: { type: number, minimum: 0 }
        mean_area_m2: { type: number, minimum: 0 }
        centroid:
          type: array
          description: "[lat, lon]"
          items: { type: number }
          minItems: 2
          maxItems: 2

    SatelliteConfounders:
      type: object
      unevaluatedProperties: false
      description: >-
        Koyu ve açık grubu ayıran, albedo dışındaki farklar; t-testi bunları kontrol etmez.
      required: [area_difference_m2, centroid_distance_m, height, note]
      properties:
        area_difference_m2:
          type: number
          description: Açık grup ortalama alanı eksi koyu grup ortalama alanı, m².
        centroid_distance_m:
          type: number
          minimum: 0
          description: İki grubun ağırlık merkezleri arasındaki mesafe, metre.
        height:
          type: string
          description: Bina yüksekliği bilgisinin durumu (OSM'de güvenilir yükseklik yok).
        note: { type: string }

    SatelliteCase:
      type: object
      unevaluatedProperties: false
      description: >-
        Bir çatı kümesinin (şehir x çatı sınıfı) bir termal aletle karşılaştırması.
        scripts/satellite_evidence.py her alanı her vaka için üretir.
      required:
        - case_id
        - city
        - period
        - roof_class
        - instrument
        - instrument_resolution_m
        - pixel_area_m2
        - mean_roof_area_m2
        - roof_to_pixel_area_ratio
        - n_low
        - n_high
        - low_albedo_group
        - high_albedo_group
        - delta_c
        - t_statistic
        - p_value
        - significant
        - significance_level
        - test
        - confounders
        - significant_raw
        - significant_bonferroni
        - significant_fdr
        - p_value_bonferroni
        - q_value_fdr
        - interpretation
        - resolution_caveat
      properties:
        case_id: { type: string, example: athens_small_roofs }
        city: { type: string, example: Athens }
        period: { type: string, example: 2026-06-01..2026-08-31 }
        roof_class:
          $ref: "#/components/schemas/RoofClass"
        instrument: { type: string }
        instrument_resolution_m: { type: number, minimum: 0 }
        pixel_area_m2:
          type: number
          minimum: 0
          description: Bir termal pikselin alanı, m² (çözünürlüğün karesi).
        mean_roof_area_m2: { type: number, minimum: 0 }
        roof_to_pixel_area_ratio:
          type: number
          minimum: 0
          description: Ortalama çatı alanı / bir termal pikselin alanı.
        n_low: { type: integer, minimum: 0 }
        n_high: { type: integer, minimum: 0 }
        low_albedo_group:
          $ref: "#/components/schemas/AlbedoGroup"
        high_albedo_group:
          $ref: "#/components/schemas/AlbedoGroup"
        delta_c: { type: number }
        t_statistic: { type: number, description: Welch t istatistiği. }
        p_value: { type: number, minimum: 0, maximum: 1 }
        significant:
          type: boolean
          description: significant_raw ile aynı; geriye dönük uyumluluk için tutulur.
        significance_level:
          type: number
          minimum: 0
          maximum: 1
          description: Düzeltmesiz test eşiği (alfa).
        test: { type: string, example: Welch two-sample t-test (high vs low albedo) }
        confounders:
          $ref: "#/components/schemas/SatelliteConfounders"
        significant_raw:
          type: boolean
          description: Düzeltmesiz p_value < significance_level.
        significant_bonferroni:
          type: boolean
          description: p_value < bonferroni_alpha (significance_level / n_tests).
        significant_fdr:
          type: boolean
          description: Benjamini-Hochberg q_value_fdr < significance_level.
        p_value_bonferroni:
          type: number
          minimum: 0
          maximum: 1
          description: min(1, p_value x n_tests).
        q_value_fdr:
          type: number
          minimum: 0
          maximum: 1
          description: Benjamini-Hochberg düzeltilmiş q değeri.
        interpretation: { type: string }
        resolution_caveat: { type: string }

    SatelliteConclusion:
      type: object
      unevaluatedProperties: false
      description: >-
        Çoklu karşılaştırma düzeltmesinden sonraki sonuç. Sayılar istemcinin metni
        ayrıştırmadan düzeltmeyi göstermesi içindir.
      required:
        - n_cases_tested
        - n_significant_raw
        - n_significant_bonferroni
        - n_significant_fdr
        - raw_significant_case_ids
        - surviving_case_ids
        - tests_summary
        - resolution_finding
        - untested_explanations
        - verdict
        - text
      properties:
        n_cases_tested: { type: integer, minimum: 0 }
        n_significant_raw: { type: integer, minimum: 0 }
        n_significant_bonferroni: { type: integer, minimum: 0 }
        n_significant_fdr: { type: integer, minimum: 0 }
        raw_significant_case_ids:
          type: array
          items: { type: string }
          description: Düzeltmesiz p < significance_level olan vakalar.
        surviving_case_ids:
          type: array
          items: { type: string }
          description: Bonferroni veya FDR düzeltmesinden sonra anlamlı kalan vakalar.
        tests_summary:
          type: string
          description: Kaç testin ham, Bonferroni ve FDR ile anlamlı kaldığının özeti.
        resolution_finding:
          type: string
          description: Termal çözünürlüğün sonucu nasıl sınırladığına dair bulgu.
        untested_explanations:
          type: array
          items: { type: string }
          description: Sinyalin yokluğu için test edilmemiş olası nedenler.
        verdict:
          type: string
          description: Tek cümlelik hüküm; arayüz başlık olarak gösterebilir.
        text:
          type: string
          description: Sayılar, açıklamalar ve hükmü birleştiren tam metin.

    LargeRoofExclusion:
      type: object
      unevaluatedProperties: false
      required: [roof_id, osm_id, reason]
      properties:
        roof_id: { type: string }
        osm_id: { type: string }
        reason:
          type: string
          description: Büyük çatının analizden neden çıkarıldığı (ör. endüstriyel alan içinde).

    CityRoofCleaning:
      type: object
      unevaluatedProperties: false
      required: [n_before, n_excluded, n_after, excluded]
      properties:
        n_before: { type: integer, minimum: 0 }
        n_excluded: { type: integer, minimum: 0 }
        n_after: { type: integer, minimum: 0 }
        excluded:
          type: array
          items:
            $ref: "#/components/schemas/LargeRoofExclusion"

    LargeRoofCleaning:
      type: object
      unevaluatedProperties: false
      description: >-
        Büyük çatı kümesinden çıkarılan binalar ve temizlik öncesi vakalar; temizliğin etkisi
        görünür kalsın diye eski sayılar silinmez.
      required: [rule, cities, significance_changed, changed_case_ids, cases_before_cleaning]
      properties:
        rule:
          type: string
          description: Hangi büyük çatıların çıkarıldığını belirleyen kural.
        cities:
          type: object
          description: Şehir anahtarına (athens, london) göre temizlik sonucu.
          additionalProperties:
            $ref: "#/components/schemas/CityRoofCleaning"
        significance_changed:
          type: boolean
          description: Temizlik bir vakanın anlamlılık bayraklarından birini değiştirdiyse true.
        changed_case_ids:
          type: array
          items: { type: string }
        cases_before_cleaning:
          type: array
          description: Çatı kaybeden kümelerin temizlik öncesi vakaları.
          items:
            $ref: "#/components/schemas/SatelliteCase"

    SatelliteEvidence:
      type: object
      unevaluatedProperties: false
      description: >-
        Gözlemsel karşılaştırma, kontrollü deney değil. Kök seviyedeki tekil alanlar
        manşet vakayı (case_id, genelde athens_small_roofs) düzleştirir; tüm vakalar cases
        içindedir.
      required:
        - source
        - data_source
        - period
        - statistic
        - case_id
        - instrument
        - instrument_resolution_m
        - low_albedo_group
        - high_albedo_group
        - delta_c
        - p_value
        - significant
        - resolution_caveat
        - n_tests
        - bonferroni_alpha
        - multiple_comparison_note
        - cases
        - large_roof_cleaning
        - conclusion
        - caveat
      properties:
        source:
          type: string
          const: measured
        data_source:
          allOf:
            - $ref: "#/components/schemas/DataSource"
          const: measured
        period:
          type: string
          example: Athens 2026-06-01..2026-08-31; London 2026-06-01..2026-08-31
        statistic:
          type: string
          description: Çatı başına hangi sıcaklık değerinin karşılaştırıldığı.
        case_id:
          type: string
          description: Kök seviyedeki tekil alanların geldiği manşet vaka.
          example: athens_small_roofs
        instrument:
          type: string
          example: Landsat 8/9 C2L2 ST_B10
        instrument_resolution_m:
          type: number
          minimum: 0
          description: Termal bandın gerçek (yeniden örneklenmemiş) uzamsal çözünürlüğü, metre.
          example: 100
        low_albedo_group:
          $ref: "#/components/schemas/AlbedoGroup"
        high_albedo_group:
          $ref: "#/components/schemas/AlbedoGroup"
        delta_c:
          type: number
          description: Açık grup ortalaması eksi koyu grup ortalaması (°C); negatif = açık çatılar daha serin.
        p_value:
          type: number
          minimum: 0
          maximum: 1
          description: Welch bağımsız iki örneklem t-testinin p değeri.
        significant:
          type: boolean
          description: p_value, significance_level (0.05) altındaysa true.
        resolution_caveat:
          type: string
          description: >-
            Termal piksel boyutunun çatı boyutuna göre sonucu nasıl sınırladığına dair
            açıklama; arayüz delta_c'yi bu notla birlikte göstermeli.
        n_tests:
          type: integer
          minimum: 1
          description: Yapılan bağımsız t-testi sayısı (vaka sayısı).
        bonferroni_alpha:
          type: number
          minimum: 0
          maximum: 1
          description: significance_level / n_tests.
        multiple_comparison_note: { type: string }
        cases:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SatelliteCase"
        large_roof_cleaning:
          $ref: "#/components/schemas/LargeRoofCleaning"
        conclusion:
          $ref: "#/components/schemas/SatelliteConclusion"
        caveat:
          type: string
          example: Observational comparison, not a controlled experiment

    RoofClass:
      type: string
      enum: [small, large]
      description: Çatı alanı sınıfı; termal piksele göre küçük ya da büyük çatı.

    ClimateMethod:
      type: string
      enum: [demand_weighted, solar_only]
      description: >-
        demand_weighted: yansıtılan ışınım yalnızca soğutma (> 24 C) veya ısıtma (< 15.5 C)
        ihtiyacı olan saatlerde sayılır. solar_only: tüm yaz saatleri kazanç, tüm kış
        saatleri kayıp sayılır.

    SeasonalBalance:
      type: object
      unevaluatedProperties: false
      description: >-
        Bir yöntemle hesaplanan mevsimsel denge. cooling_base_c ve heating_base_c yalnızca
        demand_weighted'da gelir; solar_only eşik kullanmaz.
      required:
        - cooling_benefit_kwh_per_m2
        - heating_penalty_kwh_per_m2
        - net_benefit_kwh_per_m2
        - penalty_to_benefit_ratio
      properties:
        cooling_benefit_kwh_per_m2:
          type: number
          description: Yazın çatıdan uzak tutulan ışınım (soğutma kazancı), kWh/m².
        heating_penalty_kwh_per_m2:
          type: number
          description: Kışın kaybedilen ışınım (ısıtma maliyeti), kWh/m².
        net_benefit_kwh_per_m2:
          type: number
          description: cooling_benefit - heating_penalty, kWh/m².
        penalty_to_benefit_ratio:
          type: [number, "null"]
          description: heating_penalty / cooling_benefit; kazanç sıfırsa null.
        cooling_base_c:
          type: number
          description: Soğutma ihtiyacının başladığı hava sıcaklığı (yalnızca demand_weighted).
        heating_base_c:
          type: number
          description: Isıtma ihtiyacının başladığı hava sıcaklığı (yalnızca demand_weighted).

    HeatReference:
      type: object
      unevaluatedProperties: false
      required: [summer_max_ambient_c, summer_year, historical_peak, text]
      properties:
        summer_max_ambient_c:
          type: number
          description: Referans noktasında yazın en sıcak saatin hava sıcaklığı (Open-Meteo).
        summer_year: { type: integer }
        historical_peak:
          type: [string, "null"]
          description: Ölçüm yılından farklı bir yıla ait tarihsel zirve notu; yoksa null.
        text: { type: string }

    TypicalRoofNet:
      type: object
      unevaluatedProperties: false
      description: >-
        Çatı sınıfı başına tipik bir çatının net kazancı, kWh. Şehirde o sınıftan çatı
        yoksa alan gelmez.
      properties:
        small: { type: number }
        large: { type: number }

    CityClimate:
      type: object
      unevaluatedProperties: false
      description: >-
        Bir şehrin mevsimsel enerji dengesi, iki yöntemle. Kök seviyedeki
        net_benefit_kwh_per_m2 birincil yöntemin (demand_weighted) değeridir.
      required:
        - city
        - summer_period
        - winter_period
        - roofs
        - median_current_albedo
        - coated_albedo
        - summer_surface_cooling_c
        - summer_peak_surface_cooling_c
        - heating_degree_hours
        - cooling_degree_hours
        - winter_heating_degree_days
        - winter_irradiation_kwh_per_m2
        - net_benefit_kwh_per_m2
        - heat_reference
        - demand_weighted
        - solar_only
        - typical_roof_net_kwh
      properties:
        city: { type: string, example: Athens }
        summer_period: { type: string, example: 2026-06-01..2026-08-31 }
        winter_period: { type: string, example: 2025-12-01..2026-02-28 }
        roofs: { type: integer, minimum: 0, description: Medyan albedonun hesaplandığı çatı sayısı. }
        median_current_albedo: { type: number, minimum: 0, maximum: 1 }
        coated_albedo: { type: number, minimum: 0, maximum: 1 }
        summer_surface_cooling_c:
          type: number
          description: Yaz ortalamasında kaplamanın yüzey sıcaklığına etkisi (°C, modelden).
        summer_peak_surface_cooling_c: { type: number }
        heating_degree_hours: { type: number, minimum: 0 }
        cooling_degree_hours: { type: number, minimum: 0 }
        winter_heating_degree_days:
          type: number
          minimum: 0
          description: Kış dönemi ısıtma derece-günü (HDD).
        winter_irradiation_kwh_per_m2:
          type: number
          minimum: 0
          description: Kış dönemi toplam yatay küresel ışınım, kWh/m².
        net_benefit_kwh_per_m2:
          type: number
          description: Birincil yöntemin net kazancı, kWh/m².
        heat_reference:
          $ref: "#/components/schemas/HeatReference"
        demand_weighted:
          $ref: "#/components/schemas/SeasonalBalance"
        solar_only:
          $ref: "#/components/schemas/SeasonalBalance"
        typical_roof_net_kwh:
          $ref: "#/components/schemas/TypicalRoofNet"

    ClimateMethodDescriptions:
      type: object
      unevaluatedProperties: false
      description: Her yöntemin tek cümlelik açıklaması.
      required: [demand_weighted, solar_only]
      properties:
        demand_weighted: { type: string }
        solar_only: { type: string }

    ClimateComparison:
      type: object
      unevaluatedProperties: false
      description: Kaba fiziksel tahmin, ölçüm değil; data_source her zaman simulated.
      required:
        - data_source
        - primary_method
        - secondary_method
        - secondary_method_note
        - methods
        - cities
        - conclusion
        - assumptions
        - method
        - caveat
        - weather_source
        - generated_at
      properties:
        data_source:
          allOf:
            - $ref: "#/components/schemas/DataSource"
          const: simulated
        primary_method:
          $ref: "#/components/schemas/ClimateMethod"
        secondary_method:
          $ref: "#/components/schemas/ClimateMethod"
        secondary_method_note:
          type: string
          description: İkincil yöntemin neden birincil seçilmediğini açıklar.
        methods:
          $ref: "#/components/schemas/ClimateMethodDescriptions"
        cities:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CityClimate"
        conclusion: { type: string }
        assumptions:
          type: array
          minItems: 1
          items: { type: string }
          description: Tahminin dayandığı varsayımlar; arayüz sonuçla birlikte göstermeli.
        method: { type: string }
        caveat: { type: string }
        weather_source: { type: string }
        generated_at: { type: string, format: date-time }

    DetectorMetrics:
      type: object
      additionalProperties: false
      required: [true_positives, false_positives, false_negatives, precision, recall]
      properties:
        true_positives: { type: integer, minimum: 0 }
        false_positives: { type: integer, minimum: 0 }
        false_negatives: { type: integer, minimum: 0 }
        precision: { type: number, minimum: 0, maximum: 1 }
        recall: { type: number, minimum: 0, maximum: 1 }

    DetectionRate:
      type: object
      unevaluatedProperties: false
      required: [n, rules, isolation_forest]
      properties:
        n: { type: integer, minimum: 0 }
        rules: { type: number, minimum: 0, maximum: 1 }
        isolation_forest: { type: number, minimum: 0, maximum: 1 }

    AnomalyDetectionMetrics:
      type: object
      unevaluatedProperties: false
      description: Kural tabanlı ve IsolationForest katmanları ayrı ayrı raporlanır.
      required:
        - data_source
        - sessions
        - anomalies
        - rules
        - isolation_forest
        - combined
        - detection_rate_by_kind
      properties:
        data_source:
          allOf:
            - $ref: "#/components/schemas/DataSource"
          const: simulated
        sessions:
          type: integer
          minimum: 0
          description: Değerlendirilen simüle ölçüm oturumu sayısı.
        anomalies:
          type: integer
          minimum: 0
          description: Bunlardan anomali olarak etiketlenenler.
        rules:
          $ref: "#/components/schemas/DetectorMetrics"
        isolation_forest:
          $ref: "#/components/schemas/DetectorMetrics"
        combined:
          $ref: "#/components/schemas/DetectorMetrics"
        detection_rate_by_kind:
          type: object
          description: Anomali türü (ör. frozen_sensor, replayed_upload) başına yakalama oranı.
          additionalProperties:
            $ref: "#/components/schemas/DetectionRate"

    DeltaSpread:
      type: object
      unevaluatedProperties: false
      description: Aynı kaplamanın farklı hava koşullarındaki delta dağılımı, °C.
      required: [mean_c, std_c, min_c, max_c, range_c]
      properties:
        mean_c: { type: number }
        std_c: { type: number, minimum: 0 }
        min_c: { type: number }
        max_c: { type: number }
        range_c: { type: number, minimum: 0, description: max_c - min_c. }

    NormalizationScenario:
      type: object
      unevaluatedProperties: false
      description: Aynı kaplama, bir saatlik gerçek hava koşulu altında.
      required:
        - after_measured_at
        - ambient_c
        - radiation_wm2
        - wind_ms
        - raw_delta_c
        - normalized_delta_c
      properties:
        after_measured_at: { type: string, format: date-time }
        ambient_c: { type: number }
        radiation_wm2: { type: number, minimum: 0 }
        wind_ms: { type: number, minimum: 0 }
        raw_delta_c: { type: number }
        normalized_delta_c: { type: number }

    NormalizationMetrics:
      type: object
      unevaluatedProperties: false
      description: >-
        Aynı kaplama, farklı hava koşulları: ham deltanın ve normalize deltanın
        dağılımı. "Neden yapay zeka gerekli" sorusunun ana metriği.
      required:
        - data_source
        - weather_source
        - weather_roof_id
        - albedo_before
        - albedo_after
        - before_measured_at
        - true_delta_at_standard_c
        - raw_delta
        - normalized_delta
        - spread_reduction_factor
        - scenarios
      properties:
        data_source:
          allOf:
            - $ref: "#/components/schemas/DataSource"
          const: simulated
        weather_source: { type: string }
        weather_roof_id:
          type: string
          description: Gerçek saatlik havası kullanılan çatı.
        albedo_before: { type: number, minimum: 0, maximum: 1 }
        albedo_after: { type: number, minimum: 0, maximum: 1 }
        before_measured_at: { type: string, format: date-time }
        true_delta_at_standard_c:
          type: number
          description: Fiziksel modelin standart koşullardaki gerçek deltası.
        raw_delta:
          $ref: "#/components/schemas/DeltaSpread"
        normalized_delta:
          $ref: "#/components/schemas/DeltaSpread"
        spread_reduction_factor:
          type: [number, "null"]
          description: raw_delta.std_c / normalized_delta.std_c; normalize dağılım sıfırsa null.
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/NormalizationScenario"

    MetricsReport:
      type: object
      unevaluatedProperties: false
      required: [data_source, generated_at, anomaly_detection, normalization]
      properties:
        data_source:
          allOf:
            - $ref: "#/components/schemas/DataSource"
          const: simulated
        generated_at: { type: string, format: date-time }
        anomaly_detection:
          $ref: "#/components/schemas/AnomalyDetectionMetrics"
        normalization:
          $ref: "#/components/schemas/NormalizationMetrics"
