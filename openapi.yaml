  /evidence/satellite:
    get:
      tags: [evidence]
      summary: Gerçek uydu kanıtı, koyu ve açık çatıların ölçülmüş yüzey sıcaklığı
      description: >-
        Landsat 8/9 C2L2 ST_B10 ile ölçülmüş yüzey sıcaklıklarının albedo alt ve üst
        çeyreklerine göre karşılaştırması. Kontrollü bir deney değil, gözlemsel bir
        karşılaştırmadır. data_source her zaman measured.
      operationId: getSatelliteEvidence
      responses:
        "200":
          description: Uydu kanıtı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SatelliteEvidence"
              example:
                source: measured
                data_source: measured
                instrument: Landsat 8/9 C2L2 ST_B10
                instrument_resolution_m: 100
                period: Athens 2026-06-01..2026-08-31; London 2026-06-01..2026-08-31
                statistic: per-roof zonal mean of the cloud-masked seasonal median LST, deg C
                case_id: athens_small_roofs
                low_albedo_group: &low_group
                  n: 79
                  albedo_range: [0.174, 0.25]
                  mean_c: 41.66
                  median_c: 41.65
                  std_c: 1.25
                  mean_area_m2: 182.8
                  centroid: [37.95617, 23.75832]
                high_albedo_group: &high_group
                  n: 75
                  albedo_range: [0.312, 0.454]
                  mean_c: 41.45
                  median_c: 41.38
                  std_c: 0.98
                  mean_area_m2: 178.7
                  centroid: [37.95616, 23.75889]
                delta_c: -0.21
                p_value: 0.25
                significant: false
                caveat: Observational comparison between different buildings, not a controlled before/after experiment.
                resolution_caveat: &resolution_caveat >-
                  Landsat 8/9 C2L2 ST_B10 resolves surface temperature at 100 m, i.e. 10,000 m2
                  per pixel; the mean roof here is 172 m2, 1.7% of one pixel.
                n_tests: 8
                bonferroni_alpha: 0.00625
                multiple_comparison_note: >-
                  Each case is a separate t-test, so with 8 tests at alpha 0.05 about 0.4 raw
                  'significant' result is expected by chance alone; only results that survive
                  Bonferroni or Benjamini-Hochberg correction count as findings.
                cases:
                  - &athens_small_case
                    case_id: athens_small_roofs
                    city: Athens
                    period: 2026-06-01..2026-08-31
                    roof_class: small
                    instrument: Landsat 8/9 C2L2 ST_B10
                    instrument_resolution_m: 100
                    pixel_area_m2: 10000
                    mean_roof_area_m2: 171.9
                    roof_to_pixel_area_ratio: 0.017
                    n_low: 79
                    n_high: 75
                    low_albedo_group: *low_group
                    high_albedo_group: *high_group
                    delta_c: -0.21
                    t_statistic: -1.154
                    p_value: 0.25
                    significant: false
                    significance_level: 0.05
                    test: Welch two-sample t-test (high vs low albedo)
                    confounders:
                      area_difference_m2: -4.1
                      centroid_distance_m: 50.0
                      height: "not available: OSM footprints carry no reliable height for these roofs"
                      note: >-
                        Groups are different buildings; area, height, construction, shading and
                        location are not controlled, so delta_c is an association, not an effect.
                    significant_raw: false
                    significant_bonferroni: false
                    significant_fdr: false
                    p_value_bonferroni: 1.0
                    q_value_fdr: 0.667
                    interpretation: >-
                      Roof is far smaller than one thermal pixel, so the measurement describes
                      the surroundings, not the roof.
                    resolution_caveat: *resolution_caveat
                large_roof_cleaning:
                  rule: >-
                    Excluded: building in stadium, grandstand, garage, garages, parking, carport;
                    any leisure=* tag; amenity=parking; building=yes outside a landuse=industrial area.
                  cities:
                    athens:
                      n_before: 273
                      n_excluded: 5
                      n_after: 268
                      excluded:
                        - roof_id: ATH-2005
                          osm_id: relation/7317397
                          reason: building=garage
                    london:
                      n_before: 75
                      n_excluded: 0
                      n_after: 75
                      excluded: []
                  significance_changed: false
                  changed_case_ids: []
                  cases_before_cleaning:
                    - *athens_small_case
                conclusion:
                  n_cases_tested: 8
                  n_significant_raw: 1
                  n_significant_bonferroni: 0
                  n_significant_fdr: 0
                  raw_significant_case_ids: [london_large_roofs]
                  surviving_case_ids: []
                  tests_summary: >-
                    8 cases were tested; 1 of them reached raw p < 0.05 (london_large_roofs
                    p=0.023). After Bonferroni correction (alpha = 0.05/8 = 0.00625) 0 remain, and
                    after Benjamini-Hochberg FDR correction 0 remain.
                  resolution_finding: >-
                    The roof-to-pixel area ratio rose from 0.016 (london_small_roofs) to 0.915
                    (london_large_roofs_ecostress, p=0.18), yet the signal did not strengthen: no
                    case is significant after correction. Resolution is therefore not the only problem.
                  untested_explanations:
                    - "Emissivity: bright bare-metal roofs have a low thermal emissivity, so the satellite retrieval misreads their temperature."
                    - "Location: the dark and bright groups are different buildings in different places."
                  verdict: Satellite data is not sufficient for roof-level verification; it is sufficient for targeting.
                  text: >-
                    8 cases were tested; 1 of them reached raw p < 0.05. After Bonferroni
                    correction 0 remain, and after Benjamini-Hochberg FDR correction 0 remain.
                    Satellite data is not sufficient for roof-level verification; it is
                    sufficient for targeting.
        "404":
          $ref: "#/components/responses/NotGenerated"

  /evidence/climate-comparison:
    get:
      tags: [evidence]
      summary: Şehirler arası mevsimsel enerji dengesi karşılaştırması
      description: >-
        Kaplamanın yansıttığı güneş ışınımının yazın soğutma kazancı, kışın ısıtma kaybı
        olarak kaba bir fiziksel tahmini. Gerçek Open-Meteo saatlik hava verisiyle
        hesaplanır ama sonuç ölçüm değil modeldir; data_source her zaman simulated.
        Birincil yöntem demand_weighted (yalnızca ısıtma/soğutma ihtiyacı olan saatler
        sayılır), ikincil yöntem solar_only karşılaştırma için verilir.
      operationId: getClimateComparison
      responses:
        "200":
          description: İklim karşılaştırması
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClimateComparison"
              example:
                data_source: simulated
                primary_method: demand_weighted
                secondary_method: solar_only
                secondary_method_note: >-
                  solar_only counts every hour of winter sun as a heating penalty, whether or
                  not the building needs heat then. Same data, opposite conclusions.
                methods:
                  demand_weighted: >-
                    Sunlight no longer absorbed = hourly global horizontal irradiation x (coated
                    albedo - current median albedo), counted as benefit in hours above 24.0 C
                    (cooling degree-hours) and as penalty in hours below 15.5 C (heating
                    degree-hours), over summer and winter.
                  solar_only: >-
                    The same kept-out sunlight with all summer hours as benefit and all winter
                    hours as penalty, regardless of heating or cooling demand.
                cities:
                  - city: Athens
                    summer_period: 2026-06-01..2026-08-31
                    winter_period: 2025-12-01..2026-02-28
                    roofs: 573
                    median_current_albedo: 0.279
                    coated_albedo: 0.75
                    summer_surface_cooling_c: 16.35
                    summer_peak_surface_cooling_c: 36.47
                    heating_degree_hours: 9270.0
                    cooling_degree_hours: 10093.0
                    winter_heating_degree_days: 386.0
                    winter_irradiation_kwh_per_m2: 237.1
                    net_benefit_kwh_per_m2: 240.8
                    heat_reference:
                      summer_max_ambient_c: 39.0
                      summer_year: 2026
                      historical_peak: null
                      text: "Hottest hour of summer 2026 at the Athens reference point: 39.0 C (Open-Meteo)."
                    demand_weighted:
                      cooling_benefit_kwh_per_m2: 322.9
                      heating_penalty_kwh_per_m2: 82.1
                      net_benefit_kwh_per_m2: 240.8
                      penalty_to_benefit_ratio: 0.254
                      cooling_base_c: 24.0
                      heating_base_c: 15.5
                    solar_only:
                      cooling_benefit_kwh_per_m2: 327.5
                      heating_penalty_kwh_per_m2: 111.7
                      net_benefit_kwh_per_m2: 215.8
                      penalty_to_benefit_ratio: 0.341
                    typical_roof_net_kwh: { small: 33315.0, large: 717849.0 }
                  - city: London
                    summer_period: 2026-06-01..2026-08-31
                    winter_period: 2025-12-01..2026-02-28
                    roofs: 150
                    median_current_albedo: 0.137
                    coated_albedo: 0.75
                    summer_surface_cooling_c: 16.48
                    summer_peak_surface_cooling_c: 38.62
                    heating_degree_hours: 19188.0
                    cooling_degree_hours: 2042.0
                    winter_heating_degree_days: 776.0
                    winter_irradiation_kwh_per_m2: 85.2
                    net_benefit_kwh_per_m2: 115.0
                    heat_reference:
                      summer_max_ambient_c: 36.0
                      summer_year: 2026
                      historical_peak: London reached 40 C in the July 2022 heatwave
                      text: >-
                        Hottest hour of summer 2026 at the London reference point: 36.0 C
                        (Open-Meteo). London reached 40 C in the July 2022 heatwave; that
                        figure is from 2022, not 2026.
                    demand_weighted:
                      cooling_benefit_kwh_per_m2: 180.1
                      heating_penalty_kwh_per_m2: 65.0
                      net_benefit_kwh_per_m2: 115.0
                      penalty_to_benefit_ratio: 0.361
                      cooling_base_c: 24.0
                      heating_base_c: 15.5
                    solar_only:
                      cooling_benefit_kwh_per_m2: 344.6
                      heating_penalty_kwh_per_m2: 52.2
                      net_benefit_kwh_per_m2: 292.4
                      penalty_to_benefit_ratio: 0.152
                    typical_roof_net_kwh: { small: 9810.0, large: 403914.0 }
                conclusion: >-
                  Primary method (demand_weighted): London's heating need is 2.1x Athens's,
                  and the coating's net return there is lower: 115.0 vs 240.8 kWh/m2.
                assumptions:
                  - The summer gain is a real energy saving only in buildings that are actively cooled.
                  - Heating (15.5 C) and cooling (24.0 C) bases are standard degree-hour values, not fitted to these buildings.
                method: >-
                  Sunlight no longer absorbed = hourly global horizontal irradiation x (coated
                  albedo - current median albedo), counted as benefit above 24.0 C and as
                  penalty below 15.5 C.
                caveat: Rough estimate of sunlight absorbed at the roof surface, not of building energy use.
                weather_source: open-meteo hourly weather (real, third_party)
                generated_at: "2026-10-21T15:21:24.055577+03:00"
        "404":
          $ref: "#/components/responses/NotGenerated"

