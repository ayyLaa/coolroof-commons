openapi: 3.1.0
info:
  title: CoolRoof Commons API
  description: >
    Serin çatı projeleri için sonuca dayalı doğrulama ve ödeme API'si.
    Pilot şehirler: Atina ve Londra.
  version: 0.1.0
servers:
  - url: http://localhost:8000

tags:
  - name: roofs
    description: Aday çatıların keşfi ve detayları
  - name: measurements
    description: Sıcaklık ölçümleri ve fotoğraf kanıtı
  - name: verification
    description: Doğrulama sonucu
  - name: weather
    description: Normalizasyon için hava durumu geçmişi
  - name: contracts
    description: >-
      Akıllı kontrat dilim (tranche) durumu ve oracle'ın aktardığı zincir eventleri. Dilim yapısı
      contracts/contracts/CoolRoofEscrow.sol ile aynıdır, QUALITY 60 / DURABILITY 30 /
      FORCE_MAJEURE_RESERVE 10.
  - name: demo
    description: >-
      Demo senaryolarını başa saran yardımcı uçlar. Her demo turu zincirde kendi projelerini
      fonlar ("ATH-0142#3"), çünkü bir dilim proje başına bir kez ödenir; tur 0 eksiz orijinaldir.
  - name: oracle
    description: >-
      Oracle servisi (oracle/src/server.ts), backend'den ayrı bir süreç ve porttur
      (varsayılan http://localhost:4020).
  - name: evidence
    description: >-
      Gerçek uydu kanıtı, iklim karşılaştırması ve yöntem metrikleri. Her yanıt data_source alanıyla
      measured / simulated / third_party olarak etiketlenir.

paths:
  /roofs:
    get:
      tags: [roofs]
      summary: Aday çatı listesi
      operationId: listRoofs
      parameters:
        - name: city
          in: query
          required: false
          schema: { type: string }
          example: Athens
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          example: 50
        - name: offset
          in: query
          required: false
          description: >-
            Atlanacak kayıt sayısı. limit en fazla 200 olduğu için büyük şehirler sayfa sayfa
            çekilir (Atina 576 çatı); sıra priority_score azalan, sonra roof_id, sayfalar arasında sabittir.
          schema: { type: integer, minimum: 0, default: 0 }
          example: 200
        - name: min_score
          in: query
          required: false
          description: priority_score alt sınırı
          schema: { type: number }
          example: 0.5
        - name: include_geometry
          in: query
          required: false
          description: >-
            true ise her çatının geometry alanı GeoJSON poligonuyla dolar, aksi halde null döner.
            Poligon her kaydı iki kattan fazla büyüttüğü için listede isteğe bağlıdır; detayda
            her zaman döner.
          schema: { type: boolean, default: false }
          example: true
      responses:
        "200":
          description: Aday çatı listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoofSummary"
              example:
                - roof_id: ATH-0142
                  city: Athens
                  roof_class: small
                  lat: 37.9838
                  lon: 23.7275
                  area_m2: 640.5
                  albedo: 0.18
                  surface_temp_c: 52.3
                  priority_score: 0.87
                  estimated_cost_eur: 7686.0
                  status: candidate
                  data_source: measured
                  geometry:
                    type: Polygon
                    coordinates:
                      - - [23.7272, 37.9836]
                        - [23.7278, 37.9836]
                        - [23.7278, 37.9840]
                        - [23.7272, 37.9840]
                        - [23.7272, 37.9836]
                - roof_id: ATH-0087
                  city: Athens
                  roof_class: small
                  lat: 37.9755
                  lon: 23.7348
                  area_m2: 410.0
                  albedo: 0.22
                  surface_temp_c: 48.9
                  priority_score: 0.74
                  estimated_cost_eur: 4920.0
                  status: measuring
                  data_source: simulated
                  geometry: null
        "422":
          $ref: "#/components/responses/ValidationError"

  /roofs/{roof_id}:
    get:
      tags: [roofs]
      summary: Tek çatı detayı ve geçmiş ölçümler
      operationId: getRoof
      parameters:
        - $ref: "#/components/parameters/RoofId"
      responses:
        "200":
          description: Çatı detayı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoofDetail"
              example:
                roof_id: ATH-0142
                city: Athens
                roof_class: small
                lat: 37.9838
                lon: 23.7275
                area_m2: 640.5
                albedo: 0.18
                surface_temp_c: 52.3
                priority_score: 0.87
                estimated_cost_eur: 7686.0
                status: verified
                data_source: simulated
                geometry:
                  type: Polygon
                  coordinates:
                    - - [23.7272, 37.9836]
                      - [23.7278, 37.9836]
                      - [23.7278, 37.9840]
                      - [23.7272, 37.9840]
                      - [23.7272, 37.9836]
                measurement_history:
                  - measurement_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    phase: before
                    measured_at: "2026-06-01T11:00:00Z"
                    normalized_delta_c: null
                    anomaly_flags: []
                    data_source: simulated
                  - measurement_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    phase: after
                    measured_at: "2026-07-14T12:05:00Z"
                    normalized_delta_c: -9.1
                    anomaly_flags: []
                    data_source: simulated
        "404":
          $ref: "#/components/responses/NotFound"

  /roofs/{roof_id}/series:
    get:
      tags: [roofs]
      summary: Çatı için simüle önce/sonra yüzey sıcaklığı serisi
      description: >-
        Gerçek Open-Meteo saatlik hava verisiyle sürülen fiziksel modelin (enerji
        dengesi) çıktısı. Hava verisi gerçektir, yüzey sıcaklıkları değildir; yanıt ve
        her okuma her zaman data_source = simulated taşır. Oturumlar yerel saatle
        13:00'te başlar, 15 dakika sürer, 30 saniyede bir okuma içerir.
      operationId: getSimulatedSeries
      parameters:
        - $ref: "#/components/parameters/RoofId"
        - name: before
          in: query
          required: false
          schema: { type: string, format: date, default: "2026-06-15" }
          example: "2026-07-01"
        - name: after
          in: query
          required: false
          schema: { type: string, format: date, default: "2026-07-15" }
          example: "2026-07-07"
      responses:
        "200":
          description: Simüle seri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatedSeries"
              example:
                roof_id: ATH-1000
                data_source: simulated
                model: "energy balance (1 - albedo) * radiation = h(wind) * (T_surface - T_ambient), ml/physical_model.py"
                weather_source: open-meteo hourly weather (real)
                before:
                  start: "2026-07-01T10:00:00Z"
                  albedo: 0.271
                  readings:
                    - timestamp: "2026-07-01T10:00:00Z"
                      surface_temp_c: 59.87
                      data_source: simulated
                after:
                  start: "2026-07-07T10:00:00Z"
                  albedo: 0.75
                  readings:
                    - timestamp: "2026-07-07T10:15:00Z"
                      surface_temp_c: 41.04
                      data_source: simulated
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/WeatherUnavailable"
        "422":
          $ref: "#/components/responses/ValidationError"

  /measurements:
    post:
      security:
        - OperatorApiKey: []
      tags: [measurements]
      summary: Yeni bir sıcaklık ölçümü kaydet
      operationId: createMeasurement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeasurementCreateRequest"
            example:
              roof_id: ATH-0142
              phase: after
              device_id: DEV-0391
              readings:
                - timestamp: "2026-07-14T12:00:00Z"
                  surface_temp_c: 41.8
                - timestamp: "2026-07-14T12:05:00Z"
                  surface_temp_c: 42.0
      responses:
        "201":
          description: Ölçüm kaydedildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeasurementCreateResponse"
              example:
                measurement_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                normalized_delta_c: -9.1
                anomaly_flags: []
                data_source: simulated
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MeasurementConflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /measurements/{measurement_id}/photo:
    post:
      security:
        - OperatorApiKey: []
      tags: [measurements]
      summary: Ölçüm için kapsama fotoğrafı yükle
      operationId: uploadMeasurementPhoto
      parameters:
        - name: measurement_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Çatı kaplamasının tek bir fotoğrafı.
      responses:
        "200":
          description: Kapsama analizi tamamlandı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUploadResponse"
              example:
                coverage_pct: 93.5
                mask_preview_url: https://cdn.coolroof-commons.local/masks/7c9e6679.png
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Dosya desteklenen bir fotoğraf türü değil ya da okunamıyor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_photo
                message: "Unsupported photo type '.txt', use one of ('.jpg', '.jpeg', '.png')."

  /verification/{roof_id}:
    get:
      tags: [verification]
      summary: Çatı için güncel doğrulama sonucu
      operationId: getVerification
      parameters:
        - $ref: "#/components/parameters/RoofId"
      responses:
        "200":
          description: Doğrulama sonucu
          content:
            application/json:
              schema:
                $ref: "schema/verification.json"
              example:
                roof_id: ATH-0142
                measurement_id: "11111111-1111-4111-8111-111111111111"
                measurement_phase: after
                status: approved
                measured_delta_c: -9.8
                normalized_delta_c: -9.1
                coverage_pct: 93.5
                anomaly_flags: []
                force_majeure: false
                weather:
                  ambient_c: 31.2
                  radiation_wm2: 820
                  wind_ms: 3.4
                  max_gust_ms: 7.1
                  precipitation_mm: 0
                  window_start: "2026-07-14T11:00:00Z"
                  window_end: "2026-07-14T13:00:00Z"
                evidence_hash: "0xe45b988096d509a561147d6c9c9a70f7d38d16f6e38925c8d0354c6a65279261"
                device_signature: "0x003970c6fe243ddc01eee2d95d19de0e790b568f57c0d0ad05528cf15381609d09be23b11f58efc37b275017d5ae233211304a75ff7cd8549efe21f07ae74f107a"
                measured_at: "2026-07-14T12:05:00Z"
                reason: >-
                  Normalize edilmiş sıcaklık düşüşü (-9.1°C) eşik değerin (-8.0°C) altında ve
                  kaplama kapsamı (%93.5) gerekli eşiği (%85) aşıyor. Anomali tespit edilmedi,
                  fon serbest bırakılabilir.
                data_source: simulated
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MeasurementConflict"

  /weather/{roof_id}:
    get:
      tags: [weather]
      summary: Çatı konumu için saatlik hava durumu geçmişi
      description: >-
        Saatlik hava verisi. Open-Meteo'dan alınan noktalar data_source = third_party,
        demo seed'in ürettiği noktalar data_source = simulated taşır; aynı yanıtta ikisi
        birden bulunabilir.
      operationId: getWeatherHistory
      parameters:
        - $ref: "#/components/parameters/RoofId"
        - name: start
          in: query
          required: true
          schema: { type: string, format: date }
          example: "2026-07-13"
        - name: end
          in: query
          required: true
          schema: { type: string, format: date }
          example: "2026-07-14"
      responses:
        "200":
          description: Saatlik hava durumu dizisi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeatherPoint"
              example:
                - timestamp: "2026-07-14T11:00:00Z"
                  ambient_c: 30.5
                  radiation_wm2: 790
                  wind_ms: 3.1
                  max_gust_ms: 6.4
                  precipitation_mm: 0
                  data_source: third_party
                - timestamp: "2026-07-14T12:00:00Z"
                  ambient_c: 31.2
                  radiation_wm2: 820
                  wind_ms: 3.4
                  max_gust_ms: 7.1
                  precipitation_mm: 0
                  data_source: third_party
                - timestamp: "2026-07-15T08:00:00Z"
                  ambient_c: 34.0
                  radiation_wm2: 850
                  wind_ms: 3.0
                  max_gust_ms: 6.0
                  precipitation_mm: 0
                  data_source: simulated
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/WeatherUnavailable"
        "422":
          $ref: "#/components/responses/ValidationError"

  /contracts/{roof_id}:
    get:
      tags: [contracts]
      summary: Akıllı kontrat dilim (tranche) durumu
      operationId: getContractStatus
      parameters:
        - $ref: "#/components/parameters/RoofId"
      responses:
        "200":
          description: Dilim durumları
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractStatus"
              example:
                roof_id: ATH-0355
                contract_address: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
                sponsor: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
                contractor: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
                total_amount_wei: "1000000000000000000"
                thresholds:
                  min_normalized_delta_c: -8.0
                  min_coverage_pct: 85
                  force_majeure_gust_ms: 20.0
                  force_majeure_precip_mm: 50.0
                  durability_check_days: 180
                  winter_penalty_check: false
                  rationale: >-
                    Reference city: -8.0 °C is the design requirement for Athens summer sun
                    (695 kWh/m²); other cities are scaled from it. Not yet calibrated with local
                    measurements.
                tranches:
                  - name: QUALITY
                    pct: 60
                    amount_wei: "600000000000000000"
                    status: released
                    tx_hash: "0x9b1deb4d3b7d4bad9bdd2b0d7b3dcb6d5f6c7b8a9d0e1f2a3b4c5d6e7f8a9b0c"
                    released_at: "2026-07-26T08:00:00Z"
                  - name: FORCE_MAJEURE_RESERVE
                    pct: 10
                    amount_wei: "100000000000000000"
                    status: released
                    tx_hash: "0xa2c3e4f5061728394a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b"
                    released_at: "2027-01-22T09:00:00Z"
                  - name: DURABILITY
                    pct: 30
                    amount_wei: "300000000000000000"
                    status: held
                    tx_hash: null
                    released_at: null
                events:
                  - roof_id: ATH-0355
                    event_name: ForceMajeureApplied
                    tranche: null
                    amount_wei: null
                    tx_hash: "0xa2c3e4f5061728394a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b"
                    block_number: 18234567
                    reason: gusts 24.0 m/s, 68.0 mm precipitation
                    occurred_at: "2027-01-22T09:00:00Z"
                    round: 3
                  - roof_id: ATH-0355
                    event_name: PaymentHeld
                    tranche: DURABILITY
                    amount_wei: null
                    tx_hash: "0xa2c3e4f5061728394a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b"
                    block_number: 18234567
                    reason: Durability suspended by force majeure
                    occurred_at: "2027-01-22T09:00:00Z"
                    round: 3
        "404":
          $ref: "#/components/responses/NotFound"

  /contracts/{roof_id}/events:
    post:
      security:
        - EventApiKey: []
      tags: [contracts]
      summary: Oracle'ın aktardığı bir zincir eventini kaydeder
      description: >-
        Oracle, CoolRoofEscrow'un TrancheReleased, PaymentHeld, ForceMajeureApplied ve
        UnreleasedReclaimed eventlerini buraya gönderir. Event contract_events tablosuna yazılır (GET
        /contracts/{roof_id} events listesi) ve dilimin durumu güncellenir: TrancheReleased
        dilimi released yapar, tx_hash ve released_at'i yazar; PaymentHeld held yapar.
        ForceMajeureApplied dilim durumunu değiştirmez, kontrat aynı işlemde ayrıca
        PaymentHeld(DURABILITY) ve TrancheReleased(FORCE_MAJEURE_RESERVE) yayar.
        UnreleasedReclaimed da dilim durumunu değiştirmez: ödenmemiş dilimler sponsora
        döner ama released olmaz; event zaman çizelgesine yazılır. İdempotenttir:
        aynı roof_id, tx_hash, event_name ve tranche ile tekrar gönderilen event yeniden
        kaydedilmez, kayıtlı olan döner. round, eventi yayan zincir projesinin demo turudur
        ("ATH-0142#3" için 3); oracle roof_id'den eki atar ve turu burada gönderir. Backend'in
        güncel turu dışındaki eventler 409 stale_round ile reddedilir, böylece listener'ın
        açılıştaki geçmiş taraması eski turların durumunu güncel tura yazamaz.
      operationId: recordContractEvent
      parameters:
        - $ref: "#/components/parameters/RoofId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractEventCreate"
            example:
              event_name: TrancheReleased
              tranche: QUALITY
              amount_wei: "600000000000000000"
              tx_hash: "0x9b1deb4d3b7d4bad9bdd2b0d7b3dcb6d5f6c7b8a9d0e1f2a3b4c5d6e7f8a9b0c"
              block_number: 18234012
              reason: null
              occurred_at: "2026-07-26T08:00:00Z"
              round: 3
      responses:
        "201":
          description: Kaydedilen (veya daha önce kaydedilmiş) event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractEventRecord"
              example:
                roof_id: ATH-0142
                event_name: TrancheReleased
                tranche: QUALITY
                amount_wei: "600000000000000000"
                tx_hash: "0x9b1deb4d3b7d4bad9bdd2b0d7b3dcb6d5f6c7b8a9d0e1f2a3b4c5d6e7f8a9b0c"
                block_number: 18234012
                reason: null
                occurred_at: "2026-07-26T08:00:00Z"
                round: 3
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StaleRound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /demo/reset:
    post:
      security:
        - OperatorApiKey: []
      tags: [demo]
      summary: Yeni bir demo turu açar ve üç demo çatısını seed durumuna döndürür
      description: >-
        Sadece ATH-0142, ATH-0287 ve ATH-0355'e dokunur. Bir sonraki demo turunu açar ve
        numarasını round alanında döner. Önceki turun zincir yansıması olan contract_events
        ve contract_states kayıtlarını siler; verifications, measurements ve simulated hava
        kayıtlarını siler, yüklenmiş fotoğraf dosyalarını kaldırır ve seed değerlerini geri
        yazar. Dilimler pending ve tx_hash'siz yeniden eklenir; sonra yalnızca oracle'ın
        aktardığı yeni turun eventleriyle değişir. Ölçülmüş çatılar ve third_party hava verisi
        korunur. Turu zincirde FONLAMAZ: projeleri scripts/demo-round.sh (setup-demo görevi)
        oluşturur. scripts/seed.py aynı geri yazmayı yapar ama tur açmaz.
      operationId: resetDemo
      responses:
        "200":
          description: Silinen ve geri yazılan satır sayıları
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoResetResponse"
              example:
                round: 3
                roof_ids: [ATH-0142, ATH-0287, ATH-0355]
                deleted:
                  contract_events: 4
                  contract_states: 9
                  verifications: 5
                  measurements: 8
                  weather_records: 7
                  photo_files: 2
                restored:
                  roofs: 3
                  measurements: 7
                  verifications: 4
                  weather_records: 7
                  contract_states: 9

  /demo/round:
    get:
      tags: [demo]
      summary: Backend'in yansıttığı güncel demo turu
      description: >-
        Oracle, gövdesinde round olmayan bir POST /submit'i bu tura gönderir; arayüz zinciri
        bu turun projesinden ("ATH-0142#3") okur. Henüz tur açılmadıysa 0 döner.
      operationId: getDemoRound
      responses:
        "200":
          description: Güncel tur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoRoundStatus"
              example:
                round: 3

  /health:
    servers:
      - url: http://localhost:4020
        description: Oracle servisi
    get:
      tags: [oracle]
      summary: Oracle sağlığı, cüzdanlar ve kalan demo turu bütçesi
      description: >-
        Oracle cüzdanının bakiyesi (balance), güncel gas fiyatı ve sponsor ile oracle
        cüzdanlarının her biri için bir demo turunun maliyeti (round_cost) ve o fiyatla kaç
        tur daha ödeyebildiği (rounds_left). Sponsor, escrow'un owner() adresidir. Bakiyeler
        ve maliyetler POL cinsinden ondalık dizgilerdir.
      operationId: getOracleHealth
      responses:
        "200":
          description: Oracle ve cüzdan durumu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OracleHealth"
              example:
                ok: true
                network: local
                chain_id: 31337
                contract_address: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
                oracle_address: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
                balance: "9999.99"
                gas_price_gwei: "30.0"
                sponsor:
